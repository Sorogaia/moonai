<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoonAi — Solana Token Analyzer</title>
<meta name="description" content="Paste any Solana CA or pump.fun link. Get live market data, AI narrative analysis, holder intel, and trading alpha instantly.">
<meta property="og:title" content="MoonAi — Solana Token Analyzer">

<meta property="og:url" content="https://moonaiapp.xyz/">

<meta name="twitter:title" content="MoonAi — Solana Token Analyzer">
<meta name="twitter:description" content="Paste any Solana CA or pump.fun link. Get live market data, AI narrative analysis, holder intel, and trading alpha instantly.">
<meta name="twitter:image" content="https://moonaiapp.xyz/logo.png">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #030806;
    --term-green: #00ff9c;
    --term-dim: #1f7a55;
    --term-faint: #0d3d2a;
    --white: #eafff5;
    --amber: #ffc24b;
    --red: #ff4d5e;
    --cyan: #4be0ff;
    --grid: rgba(0,255,156,0.045);
  }

  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: 'JetBrains Mono', monospace; color: var(--term-green); cursor: default; }

  /* ─── CRT FX ─── */
  #crt { position: fixed; inset: 0; z-index: 60; pointer-events: none;
    background: radial-gradient(ellipse 120% 100% at 50% 50%, transparent 58%, rgba(0,0,0,0.6) 100%); }
  #scanlines { position: fixed; inset: 0; z-index: 58; pointer-events: none; opacity: 0.5;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.12) 3px, rgba(0,0,0,0) 4px); }
  /* moving scanline sweep */
  #sweep { position: fixed; left: 0; right: 0; height: 140px; z-index: 57; pointer-events: none; opacity: 0;
    background: linear-gradient(to bottom, transparent, rgba(0,255,156,0.06) 50%, transparent);
    animation: sweepMove 7s linear infinite; }
  @keyframes sweepMove { 0%{transform:translateY(-140px)} 100%{transform:translateY(100vh)} }
  #flicker { position: fixed; inset: 0; z-index: 56; pointer-events: none; background: var(--term-green); opacity: 0; mix-blend-mode: overlay; animation: crtflicker 6s infinite; }
  @keyframes crtflicker { 0%,100%{opacity:0} 49%{opacity:0} 50%{opacity:0.02} 51%{opacity:0} 77%{opacity:0} 78%{opacity:0.025} 79%{opacity:0} }

  /* reactive grid */
  #gridbg { position: fixed; inset: -10%; z-index: 1; pointer-events: none; opacity: 0;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse 70% 70% at var(--mx,50%) var(--my,50%), black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at var(--mx,50%) var(--my,50%), black 30%, transparent 75%);
    transition: opacity 1.2s ease;
    will-change: mask-image; }

  /* ─── AUDIO TOGGLE ─── */
  #sound { position: fixed; top: 20px; right: 22px; z-index: 70;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
    color: var(--term-dim); background: rgba(3,8,6,0.6); border: 1px solid var(--term-faint);
    padding: 7px 13px; border-radius: 3px; cursor: pointer; transition: color 0.2s, border-color 0.2s; }
  #sound:hover { color: var(--term-green); border-color: var(--term-dim); }
  #sound .ico { display: inline-block; width: 1em; }

  #audio-prompt {
    position: fixed; top: 54px; right: 22px; z-index: 70;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; color: var(--term-dim);
    opacity: 0.85; transition: opacity 0.6s ease;
    animation: promptPulse 1.8s ease-in-out infinite; pointer-events: none;
  }
  @keyframes promptPulse { 0%,100%{opacity:0.4} 50%{opacity:0.9} }

  /* ─── TERMINAL ─── */
  #terminal { position: fixed; inset: 0; z-index: 10;
    padding: clamp(20px,5vh,58px) clamp(20px,6vw,110px);
    display: flex; flex-direction: column; justify-content: flex-start;
    font-size: clamp(12px,1.5vw,16px); line-height: 1.8;
    text-shadow: 0 0 6px rgba(0,255,156,0.35);
    will-change: transform, opacity, filter; }
  .ln { white-space: pre-wrap; opacity: 0; }
  .ln .prompt { color: var(--term-dim); } .ln .ok { color: var(--term-green); }
  .ln .warnc { color: var(--amber); } .ln .errc { color: var(--red); }
  .ln .cyanc { color: var(--cyan); } .ln .dim { color: var(--term-dim); } .ln .white { color: var(--white); }
  .pbar { display: inline-block; letter-spacing: 1px; } .pbar .empty { color: var(--term-faint); }
  .cursor { display: inline-block; width: 0.6em; height: 1.05em; background: var(--term-green);
    transform: translateY(0.18em); margin-left: 2px; animation: blink 1s steps(1) infinite; box-shadow: 0 0 8px var(--term-green); }
  @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

  /* ─── LIVE TICKER SIDE COLUMN ─── */
  #ticker-col { position: fixed; top: 0; right: 0; height: 100vh; width: 280px; z-index: 9;
    padding: clamp(20px,5vh,58px) 30px; opacity: 0; pointer-events: none;
    display: flex; flex-direction: column; gap: 7px;
    font-size: 11px; line-height: 1.5; transition: opacity 0.6s ease;
    mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent); }
  #ticker-col .th { color: var(--term-dim); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; opacity: 0.7; }
  .trow { display: flex; justify-content: space-between; gap: 10px; opacity: 0.85; }
  .trow .tsym { color: var(--white); } .trow .tpct.up { color: var(--term-green); } .trow .tpct.down { color: var(--red); }
  .trow .tflag.safe { color: var(--term-dim); } .trow .tflag.rug { color: var(--red); }
  @media (max-width: 900px) { #ticker-col { display: none; } }

  /* ─── DECRYPT / RESOLVE STAGE ─── */
  #resolve { position: fixed; inset: 0; z-index: 18; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    font-family: 'JetBrains Mono', monospace; }
  #ascii { color: var(--term-green); font-size: clamp(5px, 1.15vw, 11px); line-height: 1.0;
    white-space: pre; text-shadow: 0 0 8px rgba(0,255,156,0.5); letter-spacing: 1px; opacity: 0; }

  /* ─── FINAL UI ─── */
  #ui { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; opacity: 0; pointer-events: none; }
  #logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: clamp(54px,11vw,150px); letter-spacing: -0.02em; line-height: 1; color: var(--white);
    position: relative; display: flex; }
  #logo .moon { color: var(--term-green); text-shadow: 0 0 30px rgba(0,255,156,0.6); }
  #logo .lch { display: inline-block; }
  #logo .glitch-layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; }
  .tagline { margin-top: 26px; font-family: 'Space Grotesk', sans-serif; font-weight: 500;
    font-size: clamp(15px,2.3vw,23px); color: rgba(234,255,245,0.62); letter-spacing: 0.01em;
    opacity: 0; transform: translateY(12px); text-align: center; padding: 0 20px; }
  .tagline .hl { color: var(--term-green); font-weight: 600; }
  #statline { margin-top: 30px; display: flex; gap: 26px; flex-wrap: wrap; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: clamp(10px,1.3vw,13px); opacity: 0; }
  #statline .stat { color: var(--term-dim); letter-spacing: 0.05em; } #statline .stat b { color: var(--white); font-weight: 700; }
  #statline .sep { color: var(--term-faint); }
  #enter { margin-top: 40px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--bg); background: var(--term-green);
    border: none; padding: 15px 34px; border-radius: 3px; cursor: pointer; opacity: 0; transform: translateY(12px);
    transition: transform 0.15s ease, box-shadow 0.15s ease; }
  #enter:hover { transform: scale(1.05) translateY(-2px); box-shadow: 0 0 40px rgba(0,255,156,0.55); }
  #enter:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
  #enter::after { content: '_'; animation: blink 1s steps(1) infinite; margin-left: 1px; }

  #skip { position: fixed; bottom: 22px; right: 24px; z-index: 30; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.08em; color: var(--term-faint); background: none;
    border: 1px solid var(--term-faint); padding: 6px 12px; border-radius: 3px; cursor: pointer;
    transition: color 0.2s, border-color 0.2s; opacity: 0.6; }
  #skip:hover { color: var(--term-green); border-color: var(--term-dim); }
  #replay { position: fixed; bottom: 22px; right: 24px; z-index: 30; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.08em; color: var(--term-faint); background: none; border: none;
    cursor: pointer; opacity: 0; transition: opacity 0.4s, color 0.2s; }
  #replay:hover { color: var(--term-green); }
  #flash { position: fixed; inset: 0; z-index: 40; background: var(--term-green); opacity: 0; pointer-events: none; mix-blend-mode: screen; }

  /* ═══════ SWARM GATE ═══════ */
  #wake-gate {
    position: fixed; inset: 0; z-index: 80;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity 0.7s ease;
  }
  #swarm-canvas { position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; transition: opacity 1.0s ease; }
  #wake-text {
    position: relative; z-index: 2; text-align: center;
    pointer-events: none;
  }
  .wordmark {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: clamp(56px, 11vw, 150px); line-height: 1;
    letter-spacing: -0.02em; margin-bottom: 26px;
    opacity: 0; transform: translateY(10px);
    animation: wmIn 1.3s cubic-bezier(0.16,1,0.3,1) 0.4s forwards, wmBreath 4.5s ease-in-out 1.8s infinite;
  }
  .wordmark .wm-moon { color: var(--term-green);
    text-shadow: 0 0 32px rgba(0,255,156,0.55), 0 0 80px rgba(0,255,156,0.25); }
  .wordmark .wm-ai { color: var(--white);
    text-shadow: 0 0 24px rgba(234,255,245,0.4); }
  @keyframes wmIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes wmBreath {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.25); }
  }
  .wake-status {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--term-dim);
    margin-bottom: 28px; opacity: 0.7;
    animation: dormantPulse 3s ease-in-out infinite;
  }
  @keyframes dormantPulse { 0%,100%{opacity:0.3} 50%{opacity:0.75} }

  #greeting-line {
    font-family: 'Space Grotesk', sans-serif; font-weight: 400;
    font-size: clamp(17px, 2.6vw, 27px); color: rgba(234,255,245,0.92);
    letter-spacing: 0.01em; min-height: 1.4em; margin-bottom: 30px;
  }
  #greeting-text .accent { color: var(--term-green); font-weight: 600; }
  .gcursor { color: var(--term-green); font-weight: 600; }

  .wake-prompt {
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    font-size: clamp(13px, 1.8vw, 17px); color: rgba(234,255,245,0.6);
    letter-spacing: 0.08em;
    opacity: 0; transition: opacity 0.8s ease;
  }
  .wake-prompt .key {
    color: var(--term-green); font-weight: 700;
    text-shadow: 0 0 12px rgba(0,255,156,0.5);
  }
  .wcursor { color: var(--term-green); animation: blink 1s steps(1) infinite; }
  .wake-sub {
    margin-top: 14px; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; color: var(--term-faint);
    opacity: 0; transition: opacity 0.8s ease;
    animation: subFade 2.4s ease-in-out infinite;
  }
  @keyframes subFade { 0%,100%{opacity:0.3} 50%{opacity:0.6} }

  @media (max-width: 640px) { #terminal { line-height: 1.7; } #statline { gap: 14px; } }
</style>
</head>
<body>

<div id="gridbg"></div>

<!-- AUDIO TOGGLE -->
<button id="sound"><span class="ico">♫</span> SOUND: ON</button>

<!-- ═══════ AI GREETING GATE ═══════ -->
<div id="wake-gate">
  <canvas id="swarm-canvas"></canvas>
  <div id="wake-text">
    <div class="wordmark" id="wordmark" aria-label="MoonAI"><span class="wm-moon">Moon</span><span class="wm-ai">AI</span></div>
    <div class="wake-status" id="wake-status">● DORMANT</div>
    <div id="greeting-line"><span id="greeting-text"></span><span class="gcursor" id="gcursor">_</span></div>
    <div class="wake-prompt" id="wake-prompt">press <span class="key">[ ENTER ]</span><span class="wcursor">_</span></div>
    <div class="wake-sub" id="wake-sub">or tap anywhere</div>
  </div>
</div>

<!-- LIVE TICKER -->
<div id="ticker-col">
  <div class="th">◢ Live Feed · Solana</div>
  <div id="ticker-rows"></div>
</div>

<!-- TERMINAL -->
<div id="terminal" aria-hidden="true"></div>

<!-- DECRYPT RESOLVE -->
<div id="resolve"><pre id="ascii"></pre></div>

<!-- FINAL UI -->
<div id="ui">
  <div id="logo" aria-label="MoonAI">
    <span class="glitch-layer" id="gl-r" style="color:var(--red)">MoonAI</span>
    <span class="glitch-layer" id="gl-c" style="color:var(--cyan)">MoonAI</span>
    <span class="base"></span>
  </div>
  <div class="tagline" id="tag">Every Solana token. <span class="hl">Scanned before you ape.</span></div>
  <div id="statline">
    <span class="stat"><b id="s1">24,817</b> tokens tracked</span>
    <span class="sep">|</span>
    <span class="stat"><b id="s2">3,042</b> rugs flagged</span>
    <span class="sep">|</span>
    <span class="stat"><b>99.99%</b> uptime</span>
  </div>
  <button id="enter">Launch MoonAI</button>
</div>

<button id="skip">SKIP ▸</button>
<button id="replay">↺ REPLAY</button>

<div id="flash"></div>
<div id="sweep"></div>
<div id="scanlines"></div>
<div id="flicker"></div>
<div id="crt"></div>

<script src="js/intro.js"></script>
</body>
</html>
